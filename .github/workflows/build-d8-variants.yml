name: Build V8/d8 variants (sandbox, sanitizers, Fuzzilli, libFuzzer, coverage)

# Sibling of build-d8-sandbox.yml. Produces several differently-instrumented
# binaries for the SAME pinned revision, in parallel, each as its own artifact.
# Free on a public repo with standard runners (larger runners are always billed).
#
# Variants and what each is FOR:
#   sandbox          release, sandbox + corruption API          -> run the corruption probes
#   sandbox-dcheck   + dcheck_always_on + verify_heap           -> INVARIANT oracle: a violated
#                                                                 DCHECK/heap check fires instead
#                                                                 of just crashing
#   sandbox-asan     + is_asan                                  -> MEMORY-SAFETY oracle: turns
#                                                                 "it crashed" into
#                                                                 "heap-buffer-overflow at X"
#   fuzzilli         Fuzzilli's documented Linux config          -> FuzzilliCli --profile=V8
#   fuzzilli-sandbox Fuzzilli + sandbox + corruption API         -> FuzzilliCli --profile=V8Sandbox
#                                                                 (V8SandboxProfile injects
#                                                                  Sandbox corruption calls);
#                                                                 run target with --sandbox-fuzzing
#   libfuzzer        is_asan + use_libfuzzer + edge coverage     -> V8's own v8_simple_*_fuzzer
#
# Notes that matter:
#  * --sandbox-testing and --sandbox-fuzzing are "mostly identical"; --sandbox-fuzzing
#    requires the memory corruption API in the build and is the one for fuzzers.
#  * Fuzzilli needs sanitizer coverage, which V8's macOS toolchain cannot provide
#    ("sanitizer coverage for v8 is currently not supported on macOS"), hence Linux.
#  * --run-as-security-poc rejects --expose-memory-corruption-api; use --sandbox-testing
#    (or --sandbox-fuzzing) for corruption-API work.

on:
  workflow_dispatch:
    inputs:
      v8_ref:
        description: 'V8 ref: full SHA, tag, or branch (default = the campaign pin)'
        required: false
        default: 'c68946f7099c1a46dd382907e841d77eae7b2659'
        type: string
      only:
        description: 'Optional filter: comma-separated variant names to build (blank = all)'
        required: false
        default: ''
        type: string
      fuzzer_targets:
        description: 'libFuzzer targets to build for the libfuzzer variant'
        required: false
        default: 'v8_simple_json_fuzzer v8_simple_parser_fuzzer'
        type: string

permissions:
  contents: read

jobs:
  # Resolve the variant list BEFORE the build jobs so the `only` filter works.
  # A job-level `if` cannot reference `matrix` — GitHub allows only
  # github/needs/vars/inputs in jobs.<id>.if — so filtering has to happen while
  # the matrix is built, not afterwards.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          variants = [
              {"variant": "sandbox",
               "gn": "is_debug=false symbol_level=0 v8_enable_sandbox=true v8_enable_memory_corruption_api=true v8_enable_i18n_support=false v8_use_external_startup_data=false",
               "target": "d8"},
              {"variant": "sandbox-off",
               "gn": "is_debug=false symbol_level=0 v8_enable_sandbox=false v8_enable_memory_corruption_api=false v8_enable_i18n_support=false v8_use_external_startup_data=false",
               "target": "d8"},
              {"variant": "sandbox-dcheck",
               "gn": "is_debug=false dcheck_always_on=true symbol_level=1 v8_enable_verify_heap=true v8_enable_slow_dchecks=true v8_enable_sandbox=true v8_enable_memory_corruption_api=true v8_enable_i18n_support=false v8_use_external_startup_data=false",
               "target": "d8"},
              {"variant": "sandbox-i18n",
               "gn": "is_debug=false symbol_level=0 v8_enable_sandbox=true v8_enable_memory_corruption_api=true v8_enable_i18n_support=true v8_use_external_startup_data=false",
               "target": "d8"},
              {"variant": "drumbrake-jitless",
               "gn": "is_debug=false symbol_level=0 v8_enable_lite_mode=true v8_enable_webassembly=true v8_enable_drumbrake=true v8_enable_maglev=false v8_enable_turbofan=false v8_enable_sandbox=true v8_enable_memory_corruption_api=true v8_enable_i18n_support=false v8_use_external_startup_data=false",
               "target": "d8"},
              {"variant": "sandbox-asan",
               "gn": "is_debug=false symbol_level=0 is_asan=true v8_enable_sandbox=true v8_enable_memory_corruption_api=true v8_enable_i18n_support=false v8_use_external_startup_data=false",
               "target": "d8"},
              {"variant": "fuzzilli",
               "gn": "is_debug=false dcheck_always_on=true symbol_level=1 v8_static_library=true v8_enable_verify_heap=true v8_enable_partition_alloc=false v8_fuzzilli=true sanitizer_coverage_flags=\"trace-pc-guard\"",
               "target": "d8"},
              {"variant": "fuzzilli-sandbox",
               "gn": "is_debug=false dcheck_always_on=true symbol_level=1 v8_static_library=true v8_enable_verify_heap=true v8_enable_partition_alloc=false v8_fuzzilli=true sanitizer_coverage_flags=\"trace-pc-guard\" v8_enable_sandbox=true v8_enable_memory_corruption_api=true",
               "target": "d8"},
              {"variant": "libfuzzer",
               "gn": "is_debug=false symbol_level=0 is_asan=true use_libfuzzer=true v8_wasm_random_fuzzers=true sanitizer_coverage_flags=\"trace-pc-guard\" v8_enable_i18n_support=false",
               "target": "__FUZZERS__"},
          ]
          only = [s.strip() for s in os.environ.get("ONLY", "").split(",") if s.strip()]
          if only:
              variants = [v for v in variants if v["variant"] in only]
          if not variants:
              raise SystemExit("no variants match ONLY=" + os.environ.get("ONLY", ""))
          print("matrix=" + json.dumps({"include": variants}))
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.variant }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/lib/jvm /usr/local/.ghcup /opt/az 2>/dev/null || true
          df -h / | tail -1

      - name: Install dependencies
        run: |
          sudo apt-get update
          # python3-setuptools restores `distutils` on Ubuntu 24.04's Python 3.12
          # (removed upstream), which depot_tools' fetch.py still imports.
          sudo apt-get install -y python3 python3-setuptools pkg-config git curl wget
          python3 -c "from distutils import spawn; print('distutils ok')"

      - name: Install depot_tools
        run: |
          # Retry: a --depth 1 clone failed transiently on the runner with
          # "update_ref failed for ref 'HEAD' ... nonexistent object".
          for i in 1 2 3; do
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git && break
            echo "clone attempt $i failed; retrying"; rm -rf depot_tools; sleep 5
          done
          # depot_tools must be ON PATH so its wrappers (vpython3, gn, ninja)
          # are resolvable: gclient hooks exec `vpython3` by name and it was
          # "No such file or directory: 'vpython3'" without this. The env
          # opt-outs below make them use the system python instead of CIPD's.
          echo "$PWD/depot_tools" >> "$GITHUB_PATH"
          # VALIDATED FIXES (reproduced and fixed in a local ubuntu:24.04 container):
          #  * depot_tools entry points re-exec through python-bin/python3, which
          #    hard-fails with "python3_bin_reldir.txt not found" unless CIPD
          #    installed the hermetic python. The shim documents this opt-out.
          #  * VPYTHON_BYPASS makes the vpython3 wrapper exec the system python3;
          #    without it `gclient sync` hooks die with FileNotFoundError: vpython3.
          {
            echo "DEPOT_TOOLS_BOOTSTRAP_PYTHON3=0"
            echo "VPYTHON_BYPASS=manually managed python not supported by chrome operations"
          } >> "$GITHUB_ENV"
          export DEPOT_TOOLS_BOOTSTRAP_PYTHON3=0
          export VPYTHON_BYPASS="manually managed python not supported by chrome operations"
          ./depot_tools/python-bin/python3 -c "import sys; print('python shim ->', sys.version.split()[0], sys.executable)"
          ./depot_tools/vpython3 -c "import sys; print('vpython3 ->', sys.version.split()[0], sys.executable)"
          ./depot_tools/gclient --version >/dev/null && echo "gclient ok"

      - name: Sync V8 at the requested ref
        env:
          V8_REF: ${{ inputs.v8_ref }}
        run: |
          set -x
          # Use gclient directly instead of `fetch`: fetch.py imports distutils,
          # and its only job is `gclient config` + `gclient sync` anyway.
          mkdir -p build && cd build
          ../depot_tools/gclient config --unmanaged https://chromium.googlesource.com/v8/v8.git
          # Retry: chromium.googlesource.com intermittently returns HTTP 503 /
          # "fatal: expected 'packfile'" mid-clone. Retry in place, then once more
          # after clearing a possibly-corrupt partial checkout.
          attempt=0
          until ../depot_tools/gclient sync -D; do
            attempt=$((attempt+1))
            if [ "$attempt" -ge 3 ]; then echo "gclient sync failed 3x"; exit 1; fi
            echo "gclient sync attempt $attempt failed (transient 503?); retrying"
            if [ "$attempt" -ge 2 ]; then rm -rf v8; fi   # clear a possibly-corrupt partial clone
            sleep 20
          done
          cd v8
          # depot_tools' `git` is also a python shim; use the real git.
          CLEAN_PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v 'depot_tools' | paste -sd: -)
          GIT=$(PATH="$CLEAN_PATH" command -v git)
          echo "using: $GIT ($("$GIT" --version))"
          if ! "$GIT" cat-file -e "${V8_REF}^{commit}" 2>/dev/null; then
            echo "pinned commit absent; fetching"
            "$GIT" fetch origin "$V8_REF" || "$GIT" fetch origin main || true
          fi
          "$GIT" checkout "$V8_REF"
          echo "V8 commit: $("$GIT" log -1 --format='%H %ci %s')"

      - name: Report disk after sync
        run: df -h / | tail -1

      - name: Configure and build (${{ matrix.variant }})
        env:
          EXTRA: ${{ matrix.gn }}
          BUILD_TARGET: ${{ matrix.target }}
          FUZZER_TARGETS: ${{ inputs.fuzzer_targets }}
        run: |
          cd build/v8
          # bindgen (used by the Rust FFI generator) aborts if TARGET is set in
          # the environment; unset defensively as well as not defining it.
          unset TARGET || true
          BASE='is_component_build=false use_custom_libcxx=true target_cpu="x64" treat_warnings_as_errors=false is_clang=true use_lld=true clang_use_chrome_plugins=false v8_enable_object_print=true v8_enable_disassembler=true v8_enable_test_features=true'
          GN_ARGS="$BASE $EXTRA"
          # V8 standalone does not fetch Chromium's //testing/libfuzzer, but
          # third_party/fuzztest/BUILD.gn:422 requires it when use_libfuzzer=true
          # ("Unable to load .../testing/libfuzzer"). Provide the minimal shim
          # the local fuzzer builds used.
          if [ ! -e testing/libfuzzer/BUILD.gn ]; then
            mkdir -p testing/libfuzzer
            printf '%s\n' \
              '# Minimal testing/libfuzzer BUILD.gn for V8 standalone builds.' \
              'source_set("fuzzing_engine_no_main_core") {' \
              '}' \
              'source_set("fuzzing_engine") {' \
              '}' > testing/libfuzzer/BUILD.gn
          fi
          gn gen "out/${{ matrix.variant }}" --args="$GN_ARGS"
          echo "=== resolved args.gn ==="; cat "out/${{ matrix.variant }}/args.gn"
          if [ "$BUILD_TARGET" = "__FUZZERS__" ]; then
            # shellcheck disable=SC2086
            ninja -C "out/${{ matrix.variant }}" $FUZZER_TARGETS -j2
          else
            ninja -C "out/${{ matrix.variant }}" "$BUILD_TARGET" -j2
          fi
          df -h / | tail -1

      # ---- variant-specific, EXECUTED acceptance checks -------------------------
      - name: Package (${{ matrix.variant }})
        env:
          FUZZER_TARGETS: ${{ inputs.fuzzer_targets }}
        run: |
          cd "build/v8/out/${{ matrix.variant }}"
          mkdir -p pkg
          if [ -f d8 ]; then
            cp d8 pkg/
            [ -f icudtl.dat ] && cp icudtl.dat pkg/ || true
            [ -f snapshot_blob.bin ] && cp snapshot_blob.bin pkg/ || true
          # is_asan builds need their runtime shim next to the binary.
          cp ./*.so pkg/ 2>/dev/null || true
          fi
          for t in $FUZZER_TARGETS; do [ -f "$t" ] && cp "$t" pkg/ || true; done
          cp args.gn pkg/build-args.gn
          git -C ../.. rev-parse HEAD > pkg/v8-commit.txt 2>/dev/null || true
          tar -czf "d8-${{ matrix.variant }}-linux-x64.tar.gz" -C pkg .
          ls -lh "d8-${{ matrix.variant }}-linux-x64.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d8-${{ matrix.variant }}-linux-x64
          path: build/v8/out/${{ matrix.variant }}/d8-${{ matrix.variant }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
